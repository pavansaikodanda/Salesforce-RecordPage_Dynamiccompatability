<template>
    <!-- Grouped Primary: renders a single combined input that splits into two fields -->
    <template lwc:if={isGroupedPrimary}>
        <lightning-input
            type="text"
            label={fieldLabel}
            value={groupedDisplayValue}
            required={required}
            disabled={disabled}
            onchange={handleGroupedChange}
            onblur={handleBlur}>
        </lightning-input>
        <template lwc:if={splitHint}>
            <p class="slds-text-body_small slds-m-top_xx-small" style="color: #c27400;">{splitHint}</p>
        </template>
        <template lwc:if={splitPreview}>
            <p class="slds-text-body_small slds-m-top_xx-small" style="color: #2e844a;">{splitPreview}</p>
        </template>
    </template>

    <!-- Text / Email / URL / Phone -->
    <template lwc:elseif={isText}>
        <template lwc:if={isTextArea}>
            <lightning-textarea
                label={fieldLabel}
                value={stringValue}
                required={required}
                disabled={disabled}
                onchange={handleTextChange}
                onblur={handleBlur}>
            </lightning-textarea>
        </template>
        <template lwc:else>
            <lightning-input
                type={inputType}
                label={fieldLabel}
                value={stringValue}
                required={required}
                disabled={disabled}
                onchange={handleTextChange}
                onblur={handleBlur}>
            </lightning-input>
        </template>
    </template>

    <!-- Picklist -->
    <template lwc:elseif={isPicklist}>
        <lightning-combobox
            label={fieldLabel}
            value={stringValue}
            options={picklistOptions}
            required={required}
            disabled={disabled}
            onchange={handlePicklistChange}
            onblur={handleBlur}>
        </lightning-combobox>
    </template>

    <!-- Multi-Picklist -->
    <template lwc:elseif={isMultiPicklist}>
        <lightning-dual-listbox
            label={fieldLabel}
            options={picklistOptions}
            value={stringValue}
            required={required}
            disabled={disabled}
            onchange={handlePicklistChange}>
        </lightning-dual-listbox>
    </template>

    <!-- Boolean / Checkbox -->
    <template lwc:elseif={isBoolean}>
        <lightning-input
            type="checkbox"
            label={fieldLabel}
            checked={booleanValue}
            disabled={disabled}
            onchange={handleBooleanChange}>
        </lightning-input>
    </template>

    <!-- Date -->
    <template lwc:elseif={isDate}>
        <lightning-input
            type="date"
            label={fieldLabel}
            value={stringValue}
            required={required}
            disabled={disabled}
            onchange={handleDateChange}
            onblur={handleBlur}>
        </lightning-input>
    </template>

    <!-- DateTime -->
    <template lwc:elseif={isDateTime}>
        <lightning-input
            type="datetime"
            label={fieldLabel}
            value={stringValue}
            required={required}
            disabled={disabled}
            onchange={handleDateChange}
            onblur={handleBlur}>
        </lightning-input>
    </template>

    <!-- Number / Currency / Percent -->
    <template lwc:elseif={isNumber}>
        <lightning-input
            type="number"
            label={fieldLabel}
            value={numberValue}
            formatter={formatter}
            required={required}
            disabled={disabled}
            onchange={handleNumberChange}
            onblur={handleBlur}>
        </lightning-input>
    </template>

    <!-- Reference / Lookup -->
    <template lwc:elseif={isReference}>
        <lightning-record-picker
            label={fieldLabel}
            object-api-name={referenceObjectName}
            value={referenceValue}
            required={required}
            disabled={disabled}
            onchange={handleReferenceChange}>
        </lightning-record-picker>
    </template>

    <!-- Fallback -->
    <template lwc:else>
        <lightning-input
            type="text"
            label={fieldLabel}
            value={stringValue}
            required={required}
            disabled={disabled}
            onchange={handleTextChange}
            onblur={handleBlur}>
        </lightning-input>
    </template>

    <template lwc:if={helpText}>
        <p class="slds-form-element__help slds-m-top_xx-small">{helpText}</p>
    </template>
</template>
